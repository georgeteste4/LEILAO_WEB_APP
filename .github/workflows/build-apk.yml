name: Compilar APK Android (Flutter) & Publicar Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📦 Instalar Dependencias do Flutter
        working-directory: ./app_leilao
        run: flutter pub get

      - name: 🔨 Compilar APK de Release (Flutter AOT)
        working-directory: ./app_leilao
        run: flutter build apk --release

      - name: 🔍 Localizar e Renomear APK
        run: |
          mkdir -p build_output
          cp app_leilao/build/app/outputs/flutter-apk/app-release.apk build_output/leilao-app-release.apk
          echo "APK copiado com sucesso para build_output/leilao-app-release.apk"

      - name: 📤 Salvar Artefato para Download (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: leilao-app-release-apk
          path: build_output/leilao-app-release.apk
          retention-days: 30

      - name: 🚀 Criar/Atualizar GitHub Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Leilao de Imoveis - Versao Oficial v1.0.0 (Flutter)"
          body: |
            ### 📱 Leilao de Imoveis App (Android APK)
            - 🚀 Compilado em Flutter nativo (ultra-rápido, ~2 minutos)
            - 🗄️ Base de dados SQLite local com 373 imoveis pré-carregados
            - 📲 Atualizador automático de APK in-app integrado
            - 🎨 Mobile Design System com modos Grade, Tabela e Lista
          files: build_output/leilao-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
