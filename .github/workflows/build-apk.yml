name: Compilar APK Android & Publicar Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app_leilao/package.json

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Dependencias do App
        working-directory: ./app_leilao
        run: npm ci || npm install

      - name: 🏗️ Gerar Projeto Nativo Android (Expo Prebuild)
        working-directory: ./app_leilao
        run: npx expo prebuild --platform android --clean

      - name: ⚙️ Conceder Permissao de Execucao ao Gradle
        working-directory: ./app_leilao/android
        run: chmod +x gradlew

      - name: 🔨 Compilar APK de Release (Gradle)
        working-directory: ./app_leilao/android
        run: ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: 🔍 Localizar e Renomear APK
        run: |
          mkdir -p build_output
          APK_PATH=$(find app_leilao/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build_output/leilao-app-release.apk
            echo "APK copiado com sucesso para build_output/leilao-app-release.apk"
          else
            echo "APK nao encontrado na pasta release, buscando debug..."
            DEBUG_APK=$(find app_leilao/android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$DEBUG_APK" build_output/leilao-app-release.apk
          fi

      - name: 📤 Salvar Artefato para Download (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: leilao-app-release-apk
          path: build_output/leilao-app-release.apk
          retention-days: 30

      - name: 🚀 Criar/Atualizar GitHub Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Leilao de Imoveis - Versao Oficial v1.0.0"
          body: |
            ### 📱 Leilao de Imoveis App (Android APK)
            - 🗄️ Base de dados SQLite local com 373 imoveis pre-carregados
            - ⚡ Motores de extracao nativos em TypeScript (execucao sem servidor PHP)
            - 📲 Atualizador automatico de APK in-app integrado
            - 🎨 Mobile Design System com modos Grade, Tabela e Lista
          files: build_output/leilao-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
